name: Bug report
description: Something doesn't work as it should.
labels: ["bug"]
body:
  - type: dropdown
    id: board
    attributes:
      label: Keyboard
      options: [Air96 V2, Air75 V2, Air60 V2]
    validations:
      required: true
  - type: input
    id: firmware
    attributes:
      label: Firmware version
      description: The release you flashed (the `.bin` file name), or the commit if you built it yourself.
      placeholder: v1.0.0
    validations:
      required: true
  - type: dropdown
    id: connection
    attributes:
      label: Connection
      multiple: true
      options: [USB cable, Bluetooth, 2.4G dongle]
    validations:
      required: true
  - type: input
    id: rf
    attributes:
      label: RF module / dongle firmware
      description: From NuPhy's updater. 2.1.5 is required.
      placeholder: "2.1.5"
  - type: input
    id: os
    attributes:
      label: Computer and OS
      placeholder: MacBook Air M3, macOS 26.1
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happens
      description: What you did, what you expected, what happened instead. For sleep or wireless problems, say how long the keyboard was idle and which sleep mode it's in (`Fn+]` side LED color).
    validations:
      required: true
  - type: dropdown
    id: stock
    attributes:
      label: Does it happen on NuPhy's stock firmware?
      options: ["Don't know", "No, only on this firmware", "Yes, on stock too"]
