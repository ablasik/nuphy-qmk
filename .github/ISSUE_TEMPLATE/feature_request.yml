name: Feature request
description: Something the keyboard could do.
labels: ["enhancement"]
body:
  - type: dropdown
    id: board
    attributes:
      label: Keyboard
      multiple: true
      options: [Air96 V2, Air75 V2, Air60 V2]
  - type: textarea
    id: what
    attributes:
      label: What you'd like
      description: What you want to do and why. If VIA can already do it (see README, Tips), say why that isn't enough.
    validations:
      required: true
