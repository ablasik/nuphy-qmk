name: Release

# Actions → Release → Run workflow: opens a "Release vX.Y.Z" PR that turns
# ## [Unreleased] in CHANGELOG.md into ## [X.Y.Z] - date. Merging it makes the
# NuPhy firmware workflow tag the merge and create the draft release (RELEASING.md).
# (PRs made with GITHUB_TOKEN don't trigger other workflows, so the checks the PR
# needs are started by hand at the end, as in nuphy_qmk_sync.yml.)

on:
  workflow_dispatch:
    inputs:
      bump:
        description: 'MAJOR resets settings or the VIA keymap, MINOR adds or changes features, PATCH only fixes'
        type: choice
        options: [patch, minor, major]
        default: patch

permissions:
  contents: write
  pull-requests: write
  actions: write

jobs:
  pr:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: nuphy-keyboards
          fetch-depth: 0

      - name: Open the release PR
        env:
          BUMP: ${{ inputs.bump }}
        run: |
          last=$(git tag -l 'v[0-9]*' --sort=-v:refname | grep -v -- - | head -1)
          IFS=. read -r major minor patch <<< "${last#v}"
          case $BUMP in
            major) version="$((major + 1)).0.0" ;;
            minor) version="$major.$((minor + 1)).0" ;;
            patch) version="$major.$minor.$((patch + 1))" ;;
          esac
          echo "$last -> v$version"

          # what's under [Unreleased], up to the next version heading
          awk '$0 ~ "^## \\[" {p = index($0, "[Unreleased]") > 0; next} p' CHANGELOG.md > changes.md
          if ! grep -q '^- ' changes.md; then
            echo "::error::Nothing under ## [Unreleased] in CHANGELOG.md, nothing to release."
            exit 1
          fi
          sed -i "s/^## \[Unreleased\]$/## [$version] - $(date -u +%F)/" CHANGELOG.md

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout -b "release/v$version"
          git commit -am "Release v$version"
          git push origin "release/v$version"
          {
            echo "Merging this tags v$version and creates a draft release; test it on a keyboard and publish it ([RELEASING.md](docs/nuphy/RELEASING.md))."
            echo
            echo "Read the notes as a user would; edit CHANGELOG.md on this branch if anything is unclear."
            echo
            echo '---'
            cat changes.md
          } > body.md
          gh pr create --base nuphy-keyboards --head "release/v$version" \
            --title "Release v$version" --body-file body.md
          gh workflow run nuphy.yml --ref "release/v$version"
