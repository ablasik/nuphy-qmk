name: NuPhy firmware

# CI: every push to nuphy-keyboards and every PR touching the boards is linted,
# built and gets fresh Quick Guides (all downloadable from the run's artifacts).
# CD: pushing a tag like v1.2.0 creates a *draft* release with everything a user
# needs; publish it by hand once the build was tried on a keyboard (RELEASING.md).
# Tags with a dash (v1.2.0-rc1) become pre-releases.

on:
  push:
    branches: [nuphy-keyboards]   # every push: an upstream QMK merge can break the build too
    tags: ['v*']
  pull_request:
    paths:
      - 'keyboards/nuphy/**'
      - 'docs/nuphy/**'
      - '.github/workflows/nuphy*.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  changelog:
    # a PR that changes the firmware says what changed for users
    if: github.event_name == 'pull_request' && !contains(github.event.pull_request.labels.*.name, 'skip-changelog')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: CHANGELOG.md updated
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          files=$(git diff --name-only "$BASE" HEAD)
          if grep -q '^keyboards/nuphy/' <<< "$files" && ! grep -qx 'CHANGELOG.md' <<< "$files"; then
            echo "::error::Add a line under [Unreleased] in CHANGELOG.md, or label the PR skip-changelog."
            exit 1
          fi

  firmware:
    runs-on: ubuntu-latest
    container: ghcr.io/qmk/qmk_cli
    strategy:
      fail-fast: false
      matrix:
        board: [air60_v2, air75_v2, air96_v2]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0   # tags, so the firmware reports its version (git describe)

      - name: Lint
        run: |
          git config --global --add safe.directory '*'
          qmk lint -kb nuphy/${{ matrix.board }}/ansi -km default

      - name: Build
        shell: bash
        run: |
          qmk compile -kb nuphy/${{ matrix.board }}/ansi -km default
          version=$(git describe --tags --always)
          mkdir -p out
          cp nuphy_${{ matrix.board }}_ansi_default.bin "out/nuphy_${{ matrix.board }}_${version}.bin"
          cp keyboards/nuphy/${{ matrix.board }}/ansi/keymaps/*.json out/

      - uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ matrix.board }}
          path: out/

  guides:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Render Quick Guides
        run: |
          pip install playwright
          playwright install --with-deps chromium
          python3 docs/nuphy/guide/build.py
      - uses: actions/upload-artifact@v4
        with:
          name: guides
          path: docs/nuphy/*_quick_guide.*

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [firmware, guides]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true

      - name: Release notes
        shell: bash
        run: |
          version=${GITHUB_REF_NAME#v}
          # the [x.y.z] section of CHANGELOG.md, up to the next version heading
          awk -v v="$version" '$0 ~ "^## \\[" {p = index($0, "[" v "]") > 0; next} p' CHANGELOG.md > changes.md
          if ! grep -q '[^[:space:]]' changes.md; then
            echo "::error::CHANGELOG.md has no [$version] section. Rename [Unreleased] to [$version] before tagging (docs/nuphy/RELEASING.md)."
            exit 1
          fi
          {
            cat changes.md
            echo
            echo "## Flashing"
            echo
            echo "Download the \`.bin\` for **your** board. Hold \`Fn+M+Esc\` for 3 s, until the keys flash white, to enter the bootloader, then:"
            echo
            echo '```sh'
            echo "dfu-util -a 0 -d 0483:DF11 -s 0x08000000:leave -D nuphy_air96_v2_${GITHUB_REF_NAME}.bin"
            echo '```'
            echo
            echo "Update the RF module and dongle to NuPhy's firmware 2.1.5 first. Load the matching VIA file in usevia.app to remap. The Quick Guide PDFs list every shortcut."
            echo
            echo "## SHA-256"
            echo
            echo '```'
            (cd out && sha256sum -- *.bin)
            echo '```'
          } > notes.md

      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          body_path: notes.md
          files: |
            out/*.bin
            out/*.json
            out/*_quick_guide.pdf
