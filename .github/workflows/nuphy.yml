name: NuPhy firmware

# CI: every push to nuphy-keyboards and every PR touching the boards is linted,
# built and gets fresh Quick Guides (all downloadable from the run's artifacts).
# CD: when a push brings a CHANGELOG.md version without a tag (the "Release vX.Y.Z"
# commit, RELEASING.md), or a tag like v1.2.0 is pushed, the build is tagged
# and becomes a *draft* release with everything a user needs; publish it by hand
# once it was tried on a keyboard (RELEASING.md). Tags with a dash (v1.2.0-rc1)
# become pre-releases, with the [Unreleased] notes.

on:
  push:
    branches: [nuphy-keyboards]   # every push: an upstream QMK merge can break the build too
    tags: ['v*']
  pull_request:
    paths:
      - 'keyboards/nuphy/**'
      - 'docs/nuphy/**'
      - 'tests/nuphy/**'
      - 'CHANGELOG.md'
      - '.github/workflows/nuphy*.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  version:
    # the tag this run releases, if any
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.v.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        run: |
          if [[ $GITHUB_REF == refs/tags/v* ]]; then
            echo "tag=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
          elif [[ $GITHUB_EVENT_NAME == push && $GITHUB_REF == refs/heads/nuphy-keyboards ]]; then
            v=$(grep -m1 -oP '^## \[\K[0-9]+\.[0-9]+\.[0-9]+(?=\])' CHANGELOG.md)
            if ! git ls-remote --exit-code --tags origin "refs/tags/v$v" > /dev/null; then
              echo "tag=v$v" >> "$GITHUB_OUTPUT"
            fi
          fi

  changelog:
    # a PR that changes the firmware says what changed for users
    if: github.event_name == 'pull_request' && !contains(github.event.pull_request.labels.*.name, 'skip-changelog')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: CHANGELOG.md updated
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          files=$(git diff --name-only "$BASE" HEAD)
          if grep -q '^keyboards/nuphy/' <<< "$files" && ! grep -qx 'CHANGELOG.md' <<< "$files"; then
            echo "::error::Add a line under ## [Unreleased] at the top of CHANGELOG.md (add the heading if it isn't there), or label the PR skip-changelog."
            exit 1
          fi

  firmware:
    needs: version
    runs-on: ubuntu-latest
    container: ghcr.io/qmk/qmk_cli
    strategy:
      fail-fast: false
      matrix:
        board: [air60_v2, air75_v2, air96_v2]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0   # tags, so the firmware reports its version (git describe)

      - name: Lint
        run: |
          git config --global --add safe.directory '*'
          qmk lint -kb nuphy/${{ matrix.board }}/ansi -km default

      - name: Build
        shell: bash
        run: |
          tag='${{ needs.version.outputs.tag }}'
          if [ -n "$tag" ] && ! git rev-parse -q --verify "refs/tags/$tag" > /dev/null; then
            git tag "$tag"   # local only, so the build reports the version it's released as
          fi
          qmk compile -kb nuphy/${{ matrix.board }}/ansi -km default
          version=$(git describe --tags --always)
          mkdir -p out
          cp nuphy_${{ matrix.board }}_ansi_default.bin "out/nuphy_${{ matrix.board }}_${version}.bin"
          cp keyboards/nuphy/${{ matrix.board }}/ansi/keymaps/*.json out/

      - name: WS2812 side strip timing
        shell: bash
        run: |
          # a soft-float call in the bit-bang loop breaks the 150 ns pulses (Air75 side lights)
          ! arm-none-eabi-objdump -d .build/nuphy_${{ matrix.board }}_ansi_default.elf \
            | awk '/<side_send_byte>:/,/^$/' | grep -q '__aeabi'

      - uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ matrix.board }}
          path: out/

      - uses: actions/upload-artifact@v4
        with:
          name: elf-${{ matrix.board }}
          path: .build/nuphy_${{ matrix.board }}_ansi_default.elf

  emulator:
    # the Air96 V2 build on an emulated board (Renode): boot, RF link, keys, LEDs, sleep
    needs: firmware
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: elf-air96_v2
          path: .build
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Tests
        env:
          NUPHY_SLOW: '1'   # also the real-time timer tests
        run: dotnet run --project tests/nuphy/NuphyTests

  guides:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Render Quick Guides
        run: |
          pip install playwright
          playwright install --with-deps chromium
          python3 docs/nuphy/guide/build.py
      - uses: actions/upload-artifact@v4
        with:
          name: guides
          path: docs/nuphy/*_quick_guide.*

  release:
    if: needs.version.outputs.tag != ''
    needs: [version, firmware, emulator, guides]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true

      - name: Release notes
        shell: bash
        env:
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          version=${TAG#v}
          if [[ $version == *-* ]]; then version=Unreleased; fi   # a pre-release: what's coming
          # the [x.y.z] section of CHANGELOG.md, up to the next version heading
          awk -v v="$version" '$0 ~ "^## \\[" {p = index($0, "[" v "]") > 0; next} p' CHANGELOG.md > changes.md
          if ! grep -q '[^[:space:]]' changes.md; then
            echo "::error::CHANGELOG.md has no [$version] section. Release with Actions → Release (docs/nuphy/RELEASING.md)."
            exit 1
          fi
          {
            cat changes.md
            echo
            echo "## Flashing"
            echo
            echo "Download the \`.bin\` for **your** board. Hold \`Fn+M+Esc\` for 3 s, until the keys flash white, to enter the bootloader, then:"
            echo
            echo '```sh'
            echo "dfu-util -a 0 -d 0483:DF11 -s 0x08000000:leave -D nuphy_<board>_${TAG}.bin"
            echo '```'
            echo
            echo "Update the RF module and dongle to NuPhy's firmware 2.1.5 first. Load the matching VIA file in usevia.app to remap. The Quick Guide PDFs list every shortcut."
            echo
            echo "## SHA-256"
            echo
            echo '```'
            (cd out && sha256sum -- *.bin)
            echo '```'
          } > notes.md

      - name: Tag
        env:
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          if ! git ls-remote --exit-code --tags origin "refs/tags/$TAG" > /dev/null; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git tag -a "$TAG" -m "$TAG"
            git push origin "$TAG"
          fi

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          draft: true
          prerelease: ${{ contains(needs.version.outputs.tag, '-') }}
          body_path: notes.md
          files: |
            out/*.bin
            out/*.json
            out/*_quick_guide.pdf
